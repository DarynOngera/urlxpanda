# URLXpanda Render Configuration
# 
# This file defines the deployment configuration for Render.
# Two deployment options are available:
#
# 1. Native Build (default, below): Uses Python runtime with build.sh
# 2. Docker Build: Uncomment the Docker section and comment out the native section
#
# For Docker deployment:
# - Faster builds (cached layers)
# - More consistent environment
# - Slightly larger image size
#
# For Native deployment:
# - Simpler configuration
# - Direct Python runtime
# - Good for quick deployments

# Option 1: Native Python Build (Default)
services:
  - type: web
    name: urlxpanda
    runtime: python
    plan: free  # Change to 'starter' or other plans as needed
    buildCommand: cd web && ./build.sh
    startCommand: cd web && python3 serve.py
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: MAX_REDIRECTS
        value: 10
      - key: REQUEST_TIMEOUT
        value: 10
      - key: PYTHON_VERSION
        value: 3.11

